      Ranged Spell Attack: +5 to hit, range 120 ft., one target. Hit: 11 (2d10)
      fire damage.
  - name: Scorching Ray (2nd level)
    desc: >-
      Three rays, each a ranged spell attack, +5 to hit, one target per ray.
      Hit: 7 (2d6) fire damage each.
  - name: Shield (Reaction, 1st level)
    desc: +5 bonus to AC until the start of your next turn, including against the triggering attack.
