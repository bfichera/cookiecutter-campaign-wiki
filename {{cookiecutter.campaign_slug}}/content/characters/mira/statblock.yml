traits:
  - name: Fey Ancestry
    desc: >-
      Advantage on saving throws against being charmed, and magic can't put you
      to sleep.
  - name: Sculpt Spells
    desc: >-
      When you cast an evocation spell that affects others you can see, choose
      1 + the spell's level creatures; they automatically succeed the save and
      take no damage if the spell would deal half on a success.
